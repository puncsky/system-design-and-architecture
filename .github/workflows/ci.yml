name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Enable Corepack (Yarn 4 per package.json "packageManager") after setup-node.
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn format:check
      - run: yarn test
      - run: yarn check:book
