<svg width="100%" viewBox="0 0 720 516" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">HTTP Live Streaming 架构</title>
<desc id="d">音视频输入进入服务器端的媒体编码器，编码器把 MPEG-2 传输流交给流分段器。分段器把索引文件和一组 .ts 媒体文件发布到分发层的源 Web 服务器，源服务器再通过 HTTP 提供给台式机、笔记本、平板和手机等客户端。</desc>
