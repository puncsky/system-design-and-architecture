<text x="587" y="58.2" font-size="14" font-weight="500" fill="#0C447C">通用助手</text>
<text x="587" y="75.1" font-size="12" fill="#185FA5">shell、网页、应用连接器</text>
<rect x="470" y="104" width="234" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="587" y="122.2" font-size="14" font-weight="500" fill="#0C447C">电脑操作助手</text>
<text x="587" y="139.1" font-size="12" fill="#185FA5">浏览器、桌面，一次一个</text>
<rect x="470" y="168" width="234" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="587" y="186.2" font-size="14" font-weight="500" fill="#0C447C">视频助手</text>
<text x="587" y="203.1" font-size="12" fill="#185FA5">观看并审阅视频</text>
<rect x="470" y="232" width="234" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="587" y="250.2" font-size="14" font-weight="500" fill="#0C447C">云端编码智能体</text>
<text x="587" y="267.1" font-size="12" fill="#185FA5">在自己的虚拟机里改代码</text>
<rect x="24" y="140" width="84" height="44" rx="22" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="66" y="162" font-size="14" font-weight="500" fill="#2C2C2A">你</text>
<rect x="150" y="90" width="230" height="144" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="265" y="130.8" font-size="14" font-weight="500" fill="#3C3489">主智能体</text>
<text x="265" y="147.7" font-size="12" fill="#534AB7">简单问题自己回答，</text>
<text x="265" y="163.3" font-size="12" fill="#534AB7">较大的任务交给助手，</text>
<text x="265" y="178.9" font-size="12" fill="#534AB7">这样它就能一直</text>
<text x="265" y="194.5" font-size="12" fill="#534AB7">和你保持对话。</text>
