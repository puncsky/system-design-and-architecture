<svg width="100%" viewBox="0 0 720 536" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Oso Cloud 架构</title>
<desc id="d">中心区域（例如 us-east-1）中的一个 Oso Cloud 主节点，通过事件流把事件推送给你所在区域（例如 eu-west-1）Oso VPC 内的三个 Oso Cloud 副本，每个可用区一个。你的应用 1 和应用 2 运行在你的 VPC 中：应用 1 调用可用区 1 和 2 的副本，应用 2 调用可用区 2 和 3 的副本。</desc>
