<svg width="100%" viewBox="0 0 760 206" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Request path from the user to the services</title>
<desc id="d">Requests go through a GSLB (DNS) in external networks, then an L4 LB and an L7 LB in 20+ PoP locations, then the Bandaid L7 LB and the services in 3 main data centers. The left half is the downstream direction and the right half the upstream direction.</desc>
