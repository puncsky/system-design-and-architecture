<svg width="100%" viewBox="0 0 720 468" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Permit.io 架构</title>
<desc id="d">开发、产品和安全人员在 Permit.io 中编写访问控制策略，Permit.io 把策略实时更新推送给应用旁的 Permit.io PDP，并向终端用户提供嵌入式 UI 组件。终端用户的请求先到达应用 API 服务，由它向 PDP 询问是否允许，只有获批的请求才会转发给应用后端服务和应用数据库。</desc>
