<svg width="100%" viewBox="0 0 720 570" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">AI 智能体的逻辑组件</title>
<desc id="d">用户通过用户界面与智能体交互，其他智能体也与该智能体通信。智能体内部，由 LLM 和智能体工作流（规划器指挥执行器）组成的核心位于用户界面与记忆之间；记忆包含内部 RAG、会话轨迹和长期存储，以及工具和系统凭证。工具提供三类动作：读（检索）、写（更新、回复）和执行（动作、代码）。核心把工具调用发送给工具，工具访问外部环境（网页、计算机、特定领域环境、第三方服务和外部 RAG），并把观察结果返回。</desc>
