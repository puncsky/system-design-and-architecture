<svg width="100%" viewBox="0 0 760 578" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Fraud detection architecture</title>
<desc id="d">Training: a Spark stack runs a streaming ETL with MLlib K-means over Kafka topics and a batch ETL with scikit-learn DBSCAN over offline historical data, producing clustering features. Serving: callers ask the rule engine for risk scores; it calls the Fraud Detection Scoring Service, which reads the clustering features and streaming counters and calls other services. The rule engine keeps its rules in a rules DB, edited through an admin portal.</desc>
