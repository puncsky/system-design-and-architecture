<svg width="100%" viewBox="0 0 368 452" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">没有零拷贝时的 Kafka 数据路径</title>
<desc id="d">没有零拷贝时，发送文件要经过四步：先用 DMA 拷贝把磁盘数据读入内核的读缓冲区，再用 CPU 拷贝越过应用与内核的边界进入应用缓冲区，接着用第二次 CPU 拷贝回到内核的 Socket 缓冲区，最后用 DMA 拷贝送入 NIC 缓冲区。</desc>
<defs><marker id="m3B6D11" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#3B6D11" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mA32D2D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif;dominant-baseline:central;text-anchor:middle}</style></defs>
<rect x="0.5" y="0.5" width="367" height="451" rx="12" fill="#FFFFFF" stroke="#E4E2DA" stroke-width="1"/>
<text x="88" y="34" font-size="12" fill="#5F5E5A">应用上下文</text>
<text x="272" y="34" font-size="12" fill="#5F5E5A">内核上下文</text>
<path d="M184 16 L184 388" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
<path d="M240 73 A32 7 0 0 1 304 73 L304 109 A32 7 0 0 1 240 109 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<path d="M240 73 A32 7 0 0 0 304 73" fill="none" stroke="#854F0B" stroke-width="1"/>
<text x="272" y="94.5" font-size="12" font-weight="500" fill="#633806">磁盘</text>
<rect x="208" y="152" width="128" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="272" y="170" font-size="13" font-weight="500" fill="#085041">读缓冲区</text>
<rect x="208" y="268" width="128" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="272" y="286" font-size="13" font-weight="500" fill="#085041">Socket 缓冲区</text>
<rect x="208" y="340" width="128" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="272" y="358" font-size="13" font-weight="500" fill="#085041">NIC 缓冲区</text>
