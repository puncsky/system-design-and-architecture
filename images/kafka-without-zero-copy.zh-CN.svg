<text x="140" y="154" font-size="11" font-weight="600" fill="#FFFFFF">2</text>
<circle cx="140" cy="302" r="10" fill="#A32D2D"/>
<text x="140" y="302" font-size="11" font-weight="600" fill="#FFFFFF">3</text>
