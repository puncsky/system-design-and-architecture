<path d="M208 170 L94 170 Q88 170 88 176 L88 210" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#mA32D2D)"/>
<path d="M88 246 L88 280 Q88 286 94 286 L208 286" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#mA32D2D)"/>
