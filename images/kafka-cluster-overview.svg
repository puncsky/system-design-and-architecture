<svg width="100%" viewBox="0 0 760 578" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Kafka cluster overview</title>
<desc id="d">A producer writes topic zerg.hydra to three brokers inside a Kafka cluster, and a consumer reads it from the same brokers. Each broker holds replicas of two of the three partitions, one marked as leader, and ZooKeeper in the cluster manages and shares state for brokers, producers and consumers.</desc>
