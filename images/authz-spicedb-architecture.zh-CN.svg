<svg width="100%" viewBox="0 0 760 490" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">SpiceDB 架构</title>
<desc id="d">SpiceDB 节点内部，HTTP /v1/ 网关接入 authzed.api.v1.* gRPC API，再路由到八个服务。CheckPermission、ExpandPermissionTree 和 LookupResources 经 Dispatcher 分派给 Check、Expand、Lookup 图引擎；图引擎读取 datastore（CockroachDB），或通过 dispatch.v1.* 把子请求分派到另一个 SpiceDB 节点。关系与 schema 的读写服务则直接访问 datastore。</desc>
