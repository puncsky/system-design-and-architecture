<title id="t">预算分配器：成本曲线采样</title>
<desc id="d">上图：LTV 随支出变化，并带有若干数据点；采样得到的成本曲线位于一个区域内，95% 的成本曲线从该区域中抽取。下图：两条形状不同的采样曲线，各自用切线标出 ROI 为 15% 的点；曲线形状的随机变化使该点落在不同的支出水平上，从而促使算法探索不同的支出水平。</desc>
