<svg width="100%" viewBox="0 0 720 424" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Facebook photo storage: NFS-based architecture</title>
<desc id="d">The browser asks the web server for the page (1, 2), then requests the photo from the CDN (3). The CDN asks a Photo Store Server (4), which reads the file from a NAS mounted over NFS (5, 6), returns it to the CDN (7), and the CDN sends it to the browser (8).</desc>
