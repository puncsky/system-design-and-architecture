<svg width="100%" viewBox="0 0 720 468" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">照片下载流程</title>
<desc id="d">浏览器先询问 Web 服务器（1），后者查询 Haystack 目录（2、3）并回复浏览器（4）。浏览器再向 CDN 请求照片（5）；CDN 请求 Haystack 缓存（6），缓存读取 Haystack 存储（7、8），照片经 CDN 返回（9、10）。浏览器也可以直接访问 Haystack 缓存。</desc>
