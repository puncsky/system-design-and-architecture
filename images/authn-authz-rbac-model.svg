<svg width="100%" viewBox="0 0 720 236" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Role-based access control</title>
<desc id="d">A subject has roles, roles are granted permissions, and permissions apply to resources. isAuthorized(subject, action, resource) is allowed when one of the subject's roles is granted the action on the resource.</desc>
<defs><marker id="m898781" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif;dominant-baseline:central;text-anchor:middle}</style></defs>
<rect x="0.5" y="0.5" width="719" height="235" rx="12" fill="#FFFFFF" stroke="#E4E2DA" stroke-width="1"/>
<rect x="16" y="16" width="688" height="196" rx="10" fill="#F7F6F3" stroke="#B4B2AA" stroke-width="1" stroke-dasharray="5 4"/>
<text x="360" y="32" font-size="12" fill="#5F5E5A">Ory Keto — Role-Based Access Control (RBAC)</text>
<rect x="32" y="64" width="112" height="74" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="88" y="85.4" font-size="14" font-weight="500" fill="#2C2C2A">Subject</text>
<text x="88" y="102.3" font-size="12" fill="#5F5E5A">user /</text>
<text x="88" y="117.9" font-size="12" fill="#5F5E5A">service</text>
<rect x="216" y="64" width="112" height="74" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="272" y="85.4" font-size="14" font-weight="500" fill="#712B13">Role</text>
<text x="272" y="102.3" font-size="12" fill="#993C1D">a set of</text>
<text x="272" y="117.9" font-size="12" fill="#993C1D">permissions</text>
<rect x="400" y="64" width="112" height="74" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="456" y="93.2" font-size="14" font-weight="500" fill="#712B13">Permission</text>
<text x="456" y="110.1" font-size="12" fill="#993C1D">an action</text>
<rect x="584" y="64" width="112" height="74" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="640" y="85.4" font-size="14" font-weight="500" fill="#633806">Resource</text>
<text x="640" y="102.3" font-size="12" fill="#854F0B">what is</text>
<text x="640" y="117.9" font-size="12" fill="#854F0B">protected</text>
<path d="M144 101 L216 101" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m898781)"/>
<rect x="166.9" y="91.6" width="26.2" height="18.9" rx="4" fill="#FFFFFF"/>
<text x="180" y="101" font-size="11" fill="#5F5E5A">has</text>
<path d="M328 101 L400 101" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m898781)"/>
<rect x="343.2" y="91.6" width="41.5" height="18.9" rx="4" fill="#FFFFFF"/>
<text x="364" y="101" font-size="11" fill="#5F5E5A">grants</text>
<path d="M512 101 L584 101" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m898781)"/>
<rect x="538" y="91.6" width="20.1" height="18.9" rx="4" fill="#FFFFFF"/>
<text x="548" y="101" font-size="11" fill="#5F5E5A">on</text>
<text x="360" y="159.6" font-size="12" fill="#444441">isAuthorized(subject, action, resource) is allowed when one of the</text>
<text x="360" y="176.4" font-size="12" fill="#444441">subject's roles is granted the action on the resource.</text>
</svg>
