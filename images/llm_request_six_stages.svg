<svg width="100%" viewBox="0 0 720 334" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Six stages from request to response</title>
<desc id="d">An LLM request flows through routing, tokenization, queueing and batching, prefill, decode, and streaming out. Prefill writes the KV cache and decode reads it.</desc>
<defs><marker id="m898781" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif;dominant-baseline:central;text-anchor:middle}</style></defs>
<rect x="0.5" y="0.5" width="719" height="333" rx="12" fill="#FFFFFF" stroke="#E4E2DA" stroke-width="1"/>
<rect x="40" y="36" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="120" y="56.2" font-size="14" font-weight="500" fill="#3C3489">1. Request &amp; routing</text>
<text x="120" y="73.1" font-size="12" fill="#534AB7">Route to a replica</text>
<rect x="280" y="36" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="360" y="56.2" font-size="14" font-weight="500" fill="#3C3489">2. Tokenize</text>
<text x="360" y="73.1" font-size="12" fill="#534AB7">Text → token IDs</text>
<rect x="520" y="36" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="600" y="56.2" font-size="14" font-weight="500" fill="#3C3489">3. Queue &amp; batch</text>
<text x="600" y="73.1" font-size="12" fill="#534AB7">Admit and batch work</text>
<rect x="40" y="146" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="120" y="166.2" font-size="14" font-weight="500" fill="#3C3489">4. Prefill</text>
<text x="120" y="183.1" font-size="12" fill="#534AB7">Process the prompt</text>
<rect x="280" y="146" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="360" y="166.2" font-size="14" font-weight="500" fill="#3C3489">5. Decode</text>
<text x="360" y="183.1" font-size="12" fill="#534AB7">Generate tokens</text>
<rect x="520" y="146" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="600" y="166.2" font-size="14" font-weight="500" fill="#3C3489">6. Stream out</text>
<text x="600" y="183.1" font-size="12" fill="#534AB7">Detokenize + stream</text>
<path d="M200 64 L280 64" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m898781)"/>
<path d="M440 64 L520 64" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m898781)"/>
<path d="M600 92 L600 113 Q600 119 594 119 L126 119 Q120 119 120 125 L120 146" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m898781)"/>
<path d="M200 174 L280 174" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m898781)"/>
<path d="M440 174 L520 174" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m898781)"/>
<rect x="40" y="250" width="400" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="240" y="272.2" font-size="14" font-weight="500" fill="#633806">KV cache</text>
<text x="240" y="289.1" font-size="12" fill="#854F0B">Written in prefill · read in decode</text>
<path d="M120 202 L120 250" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m898781)"/>
<path d="M360 250 L360 202" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#m898781)"/>
</svg>
