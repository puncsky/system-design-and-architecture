<svg width="100%" viewBox="0 0 760 846" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">The Single Stock-Exchange Simulator</title>
<desc id="d">Trader agents (re-trained learning agent, learning agent, ZI agent, market maker) place orders into a double auction market where Accept Order passes them to Match and Store Order, Execute Order and the order book; trades and quotes flow to Calculate Balance, and confirmations and notifications loop back to the agents.</desc>
