<svg width="100%" viewBox="0 0 720 470" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Modern AI systems stack</title>
<desc id="d">The objective on top is to maximize task success subject to latency, cost, resources, reliability and security. Below it, a stack from top to bottom: application and user; agent harness (planning, context, memory, tools, subagents); model beside the external environment; serving system beside tools; runtime and kernels beside systems; and hardware. A side column shows that agent, serving and hardware are co-designed.</desc>
