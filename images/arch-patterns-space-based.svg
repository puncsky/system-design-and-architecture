<title id="t">Space-based architecture</title>
<desc id="d">Three processing units each contain modules, in-memory data with async persistence to a database, and a data-replication engine; the engines replicate to each other. All units sit on a virtualize middleware layer made of a messaging grid, data grid, processing grid and deployment manager.</desc>
