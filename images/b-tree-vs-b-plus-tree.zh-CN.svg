<svg width="100%" viewBox="0 0 720 580" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">4 阶 B 树与 B+ 树对比</title>
<desc id="d">两个 4 阶树上下对照。B 树中每个节点的每个键都带有指向数据记录的指针；B+ 树只有叶子节点带数据指针，内部节点只存键，叶子节点从左到右依次链接，最后指向 NULL。</desc>
