<svg width="100%" viewBox="0 0 720 428" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">支付 webhook 架构</title>
<desc id="d">商家通过仪表板前端向用户与 webhook 注册服务注册 webhook。支付状态机把事件发布到事件队列，webhook 调用者订阅队列、读取注册信息、把通知存入存储、通过定时任务重试，并向互联网上的商家发起 HTTP 调用。旁边还有一个可观察性技术栈。</desc>
