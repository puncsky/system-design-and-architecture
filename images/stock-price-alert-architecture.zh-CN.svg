<svg width="100%" viewBox="0 0 760 534" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">股票价格智能通知架构</title>
<desc id="d">cronjob 触发价格监测器与价格观察者：价格监测器每 5 分钟向外部供应商取价并批量写入时间序列数据库，价格观察者定期读取数据库、借助限流缓存并向通知队列发出事件。通知者从队列取事件，查询用户设置（Robinhood 应用经反向代理与 API 网关访问），再通过 APNs、FCM 或电子邮件服务把通知送回应用。</desc>
