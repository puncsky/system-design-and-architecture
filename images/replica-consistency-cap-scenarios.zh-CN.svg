<svg width="100%" viewBox="0 0 720 336" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">CAP 定理的三种情形</title>
<desc id="d">三个面板，每个都有两个副本和一个从两者读取的用户。AP，无 C：网络分区把 State=1 与 State=2 隔开，两者都可用，用户看到 1 和 2。CP，无 A：分区隔开两者，State=1 不可用，用户只能看到 2。AC，无 P：两个副本相连且都是 State=1，用户看到 1。</desc>
