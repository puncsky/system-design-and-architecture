<svg width="100%" viewBox="0 0 720 436" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Facebook TAO 架构</title>
<desc id="d">主、副本两个数据中心各有 Web 服务器、跟随缓存、领导缓存和数据库。跟随缓存把读未命中和写入转发给领导缓存，领导缓存回传一致性消息；主数据库通过复制流异步复制到副本数据库，副本领导缓存把写入转发给主领导缓存。</desc>
