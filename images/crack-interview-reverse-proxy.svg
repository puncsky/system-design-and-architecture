<svg width="100%" viewBox="0 0 720 278" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Reverse proxy example</title>
<desc id="d">A browser or client sends every request for example.com/* to a reverse proxy, which routes example.com/blog to a WordPress server, example.com/api to a Golang API server and example.com/index.html to a Node.js server.</desc>
