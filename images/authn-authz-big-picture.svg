<svg width="100%" viewBox="0 0 760 946" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">AuthN, AuthZ and identity: the whole picture</title>
<desc id="d">Clients reach an identity-aware proxy at the edge, which checks a Bloom filter and a Redis blocklist for revoked tokens. Requests without a valid credential are redirected to the identity provider in the IAM team, while valid tokens flow into the service mesh and then the authorization layer (RBAC, PBAC/ABAC, ReBAC) before reaching protected resources.</desc>
