<svg width="100%" viewBox="0 0 760 522" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Square Cash / PayPal 转账系统架构</title>
<desc id="d">商户用户与最终用户通过演示层的仪表板与钱包应用使用系统，其客户端调用单体 API 网关，再到带风险控制的支付服务，后端有用户资料 AuthDB 与 Aurora 支付数据库。支付服务与支付网关（风险控制、AWS CloudHSM，对接银行和供应商）向事件队列发布事件，副作用制造者以及由任务队列和操作员驱动的财务报告也使用该队列。</desc>
