<svg width="100%" viewBox="0 0 760 434" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Ory Kratos 示例架构</title>
<desc id="d">UI 通过公开端口和管理端口调用 Kratos；Kratos 连接 MailSlurper 和数据库。模块依赖详情中，daemon 使用 RegistryDefault，后者实现 Driver Registry Interface，并组合、注册各工作流处理器（登录、schema、设置、自助服务处理器、执行器和钩子），处理器再使用密码、OIDC、个人资料和恢复令牌等策略。</desc>
