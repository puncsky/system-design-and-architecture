<svg width="100%" viewBox="0 0 760 548" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Hotel booking system architecture</title>
<desc id="d">Hotel admins use an admin portal and guests use a web or mobile app; all go through a reverse proxy and API gateway to Payment, User Profile / Auth, Inventory and Bookings services. Payment calls an external payment gateway and has its own database, while the other three share one. Bookings publish to a queue consumed by a notifier that sends through APNs, FCM and email back to the guests.</desc>
