<svg width="100%" viewBox="0 0 720 450" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">The five concurrency models at a glance</title>
<desc id="d">Five small pictograms: single-threaded is one execution line; threading or processing with a lock is several lines guarding shared data with a lock; CSP is four goroutines exchanging messages with one channel; Actors are five actor nodes exchanging messages along links; STM is a shared timeline from which transactions fork off.</desc>
