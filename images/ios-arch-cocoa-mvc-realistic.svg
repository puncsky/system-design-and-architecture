<svg width="100%" viewBox="0 0 760 232" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Cocoa MVC in reality</title>
<desc id="d">The UIView and the UIViewController overlap: the View and the Controller are fused into one tightly coupled pair, linked back and forth by the view life cycle. The Controller owns and updates the Model, and the Model notifies it (dashed).</desc>
