<svg width="100%" viewBox="0 0 760 464" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Zanzibar architecture</title>
<desc id="d">Clients send Check, Read, Expand and Write requests to a serving cluster of four fully connected aclservers, which read and write namespace configs and relation tuples in Spanner and append to a changelog. A watchserver tails the changelog and streams watch events to clients and to the Leopard indexing system, which also reads namespace snapshots dumped by a periodic offline pipeline and feeds optimized set computation back to the aclservers.</desc>
