<svg width="100%" viewBox="0 0 720 596" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">指标系统：InfluxDB 推送模型与 Prometheus 拉取模型</title>
<desc id="d">上图：服务器农场中的 telegraf 向 InfluxDB 写入数据，Grafana 通过 REST API 访问 InfluxDB。下图：Prometheus 的检索组件从应用程序的客户端库以及第三方应用程序前的导出器拉取指标，写入存储，通过 PromQL 为 Web UI、Grafana 和 API 客户端提供查询，借助服务发现，并经 Alertmanager 向 PagerDuty 和邮件发出告警。</desc>
