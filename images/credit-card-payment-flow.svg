<svg width="100%" viewBox="0 0 720 338" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Credit card payment processing</title>
<desc id="d">Five parties: the cardholder pays the merchant, the merchant passes the payment to the acquirer, the acquirer goes through the payment network (Visa, MasterCard, Discover, AmEx) to the issuer, and the cardholder is also linked directly to the issuer.</desc>
