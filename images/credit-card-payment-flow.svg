<text x="630" y="113.5" font-size="12" fill="#534AB7">e.g. Visa,</text>
<text x="630" y="129.1" font-size="12" fill="#534AB7">MasterCard,</text>
<text x="630" y="144.7" font-size="12" fill="#534AB7">Discover, AmEx</text>
