<svg width="100%" viewBox="0 0 760 645" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Uber 架构</title>
<desc id="d">乘客与司机 App 通过 HTTP 或 QUIC 访问公共 API 网关，服务间使用 Thrift RPC 并通过服务发现互联。派单服务按地理分片、属于核心链路；行程、支付、用户资料各自拥有数据库。共享基础设施包括 Schemaless MySQL 代理、twemproxy 缓存代理，以及 Kafka 到数据仓库的数据管道。</desc>
