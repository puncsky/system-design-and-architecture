<svg width="100%" viewBox="0 0 720 468" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Permit.io architecture</title>
<desc id="d">Developers, product and security people author access-control policy in Permit.io, which pushes real-time policy updates to the Permit.io PDP running next to the application and serves embedded UI components to the end user. The end user's requests reach the App API Service, which asks the PDP whether the call is allowed and forwards only approved requests to the App Backend Service and the App Database.</desc>
