<text x="355" y="198.2" font-size="11" fill="#534AB7">的中介者</text>
<rect x="566" y="150" width="170" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="651" y="167.7" font-size="14" font-weight="500" fill="#3C3489">交互器</text>
<text x="651" y="183.9" font-size="11" fill="#534AB7">操作数据</text>
<text x="651" y="198.2" font-size="11" fill="#534AB7">与用例</text>
