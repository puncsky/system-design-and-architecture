<svg width="100%" viewBox="0 0 760 418" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">VIPER</title>
<desc id="d">五个角色：视图、呈现者、交互器、实体和路由器。视图持有呈现者并向其发送用户操作，呈现者更新视图（虚线）。呈现者持有交互器并请求其更新；交互器通知呈现者（虚线），并了解实体（虚线）。路由器与呈现者相连（虚线）。</desc>
<defs><marker id="m898781" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="s898781" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M8 1L2 5L8 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif;dominant-baseline:central;text-anchor:middle}</style></defs>
