<text x="109" y="347.7" font-size="14" font-weight="500" fill="#0C447C">视图</text>
<text x="109" y="363.9" font-size="11" fill="#185FA5">UIView 和/或</text>
<text x="109" y="378.2" font-size="11" fill="#185FA5">UIViewController</text>
