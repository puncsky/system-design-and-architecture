<svg width="100%" viewBox="0 0 720 570" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Logical components of an AI agent</title>
<desc id="d">A user talks to the agent's user interface, and other agents communicate with the agent. Inside the agent, a core made of the LLM and an agent workflow (a planner directing actors) sits between the user interface and memory, which holds internal RAG, session trace and long-term store, and tool and system credentials. Tools offer three kinds of action: read (retrieval), write (update, reply) and execute (actions, code). The core sends tool calls to a tool that reaches the external environment (web, computer, domain-specific environments, third-party services, external RAG) and gets observations back.</desc>
