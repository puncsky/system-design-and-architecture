<title id="t">Cleo 联想搜索架构</title>
<desc id="d">用户在浏览器中输入，浏览器带有浏览器缓存，并调用网络层。网络层调用联想搜索中的结果聚合器，再由聚合器分发到社交网络、公司、群组、技能、站点功能等各个联想后端。</desc>
