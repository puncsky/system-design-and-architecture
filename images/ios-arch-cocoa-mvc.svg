<svg width="100%" viewBox="0 0 760 278" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Cocoa MVC in theory</title>
<desc id="d">The View sends user actions to the Controller (dashed). The Controller updates both the Model and the View, and the Model notifies the Controller (dashed). The View and the Model do not talk to each other, so the Controller decouples them.</desc>
