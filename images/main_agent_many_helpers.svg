<svg width="100%" viewBox="0 0 728 424" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">One main agent, many helpers</title>
<desc id="d">You talk with a main agent, which answers quick questions itself and hands bigger tasks, with a complete task description, to helpers: a general helper, a computer-use helper, a video helper and a cloud coding agent. Each helper returns only a short report. The main agent keeps a to-do list per request and can check on a helper, send it a message, or stop all helpers.</desc>
<defs><marker id="m898781" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif;dominant-baseline:central;text-anchor:middle}</style></defs>
