<text x="587" y="139.1" font-size="12" fill="#185FA5">Browser, desktop, one at a time</text>
<rect x="470" y="168" width="234" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="587" y="186.2" font-size="14" font-weight="500" fill="#0C447C">Video helper</text>
<text x="587" y="203.1" font-size="12" fill="#185FA5">Watches and reviews video</text>
<rect x="470" y="232" width="234" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="587" y="250.2" font-size="14" font-weight="500" fill="#0C447C">Cloud coding agent</text>
<text x="587" y="267.1" font-size="12" fill="#185FA5">Code changes in its own VM</text>
<rect x="24" y="140" width="84" height="44" rx="22" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="66" y="162" font-size="14" font-weight="500" fill="#2C2C2A">You</text>
<rect x="150" y="90" width="230" height="144" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="265" y="130.8" font-size="14" font-weight="500" fill="#3C3489">Main agent</text>
<text x="265" y="147.7" font-size="12" fill="#534AB7">Answers quick questions</text>
<text x="265" y="163.3" font-size="12" fill="#534AB7">itself. Hands bigger</text>
<text x="265" y="178.9" font-size="12" fill="#534AB7">tasks to a helper, so it</text>
<text x="265" y="194.5" font-size="12" fill="#534AB7">can keep talking to you.</text>
