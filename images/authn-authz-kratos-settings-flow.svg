<rect x="243" y="46.1" width="154" height="18.9" rx="4" fill="#FFFFFF"/>
<text x="320" y="55.5" font-size="11" fill="#5F5E5A">User clicks “Save changes”</text>
<rect x="190" y="150" width="260" height="36" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="320" y="168" font-size="13" font-weight="500" fill="#3C3489">Execute Before Settings Hook(s)</text>
<path d="M320 114 L320 150" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m898781)"/>
<rect x="548" y="224" width="180" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="638" y="239.5" font-size="13" font-weight="500" fill="#2C2C2A">User Interface renders</text>
<text x="638" y="256.4" font-size="13" font-weight="500" fill="#2C2C2A">Settings Flow Forms</text>
<path d="M450 168 L632 168 Q638 168 638 174 L638 224" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m898781)"/>
<rect x="225" y="300" width="190" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="320" y="315.6" font-size="13" font-weight="500" fill="#0C447C">Check if privileged</text>
<text x="320" y="332.4" font-size="13" font-weight="500" fill="#0C447C">fields were updated</text>
<path d="M548 248 L326 248 Q320 248 320 254 L320 300" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m898781)"/>
<rect x="352.3" y="238.6" width="163.3" height="18.9" rx="4" fill="#FFFFFF"/>
<text x="434" y="248" font-size="11" fill="#5F5E5A">User provides valid form data</text>
<rect x="548" y="350" width="180" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="638" y="365.6" font-size="13" font-weight="500" fill="#0C447C">Update Settings Flow</text>
<text x="638" y="382.4" font-size="13" font-weight="500" fill="#0C447C">with error context(s)</text>
<path d="M638 272 L638 350" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m898781)"/>
<rect x="551.7" y="301.6" width="172.7" height="18.9" rx="4" fill="#FFFFFF"/>
<text x="638" y="311" font-size="11" fill="#5F5E5A">User provides invalid form data</text>
<path d="M728 374 L738 374 Q744 374 744 368 L744 254 Q744 248 738 248 L728 248" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m898781)"/>
<rect x="190" y="400" width="260" height="48" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="320" y="415.6" font-size="13" font-weight="500" fill="#712B13">Ask user to sign in again/</text>
