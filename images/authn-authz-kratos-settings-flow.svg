<svg width="100%" viewBox="0 0 760 723" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Ory Kratos settings flow</title>
<desc id="d">State diagram of the settings flow: the user clicks Save changes, the flow is initialized and before-hooks run (a failing hook ends in Error). The UI renders the form; invalid input updates the flow with errors and re-renders, valid input checks privileged fields, asks for re-authentication if needed, runs after-hooks and ends with a successful update or an Error.</desc>
<defs><marker id="m898781" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif;dominant-baseline:central;text-anchor:middle}</style></defs>
<rect x="0.5" y="0.5" width="759" height="722" rx="12" fill="#FFFFFF" stroke="#E4E2DA" stroke-width="1"/>
<circle cx="320" cy="26" r="7" fill="#2C2C2A" stroke="#2C2C2A" stroke-width="1"/>
<rect x="225" y="78" width="190" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="320" y="96" font-size="13" font-weight="500" fill="#0C447C">Flow is initialized</text>
