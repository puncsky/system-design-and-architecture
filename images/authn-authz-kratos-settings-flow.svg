<circle cx="200" cy="690" r="5" fill="#2C2C2A" stroke="#2C2C2A" stroke-width="1"/>
<path d="M80 626 L80 684 Q80 690 86 690 L191 690" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m898781)"/>
<path d="M320 626 L320 684 Q320 690 314 690 L209 690" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m898781)"/>
