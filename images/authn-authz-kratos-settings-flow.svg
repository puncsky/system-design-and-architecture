<rect x="250.8" y="464.6" width="138.5" height="18.9" rx="4" fill="#FFFFFF"/>
<text x="320" y="474" font-size="11" fill="#5F5E5A">Authentication successful</text>
<path d="M415 324 L484 324 Q490 324 490 330 L490 512 Q490 518 484 518 L450 518" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m898781)"/>
<rect x="479.9" y="411.6" width="20.1" height="18.9" rx="4" fill="#FFFFFF"/>
<text x="490" y="421" font-size="11" fill="#5F5E5A">no</text>
<rect x="30" y="590" width="100" height="36" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="80" y="608" font-size="13" font-weight="500" fill="#791F1F">Error</text>
<path d="M190 168 L66 168 Q60 168 60 174 L60 590" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m898781)"/>
<rect x="26" y="369.6" width="68.1" height="18.9" rx="4" fill="#FFFFFF"/>
<text x="60" y="379" font-size="11" fill="#5F5E5A">A hook fails</text>
<path d="M190 518 L116 518 Q110 518 110 524 L110 590" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m898781)"/>
<rect x="76" y="544.6" width="68.1" height="18.9" rx="4" fill="#FFFFFF"/>
<text x="110" y="554" font-size="11" fill="#5F5E5A">A hook fails</text>
<rect x="210" y="590" width="220" height="36" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
