<title id="t">Lambda architecture layers</title>
<desc id="d">New data is sent to both the batch layer, which keeps the master dataset, and the speed layer, which maintains realtime views. The batch layer feeds the serving layer, which holds batch views, and a query is answered from both the serving layer and the speed layer.</desc>
