<svg width="100%" viewBox="0 0 720 358" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">认证服务前的身份感知代理</title>
<desc id="d">Web 应用和移动应用把 cookie 或 token 发给身份感知代理。代理再把请求分发到 OAuth2 与 OpenID Connect 提供者、授权服务、身份提供者和管理者，以及其他服务。</desc>
