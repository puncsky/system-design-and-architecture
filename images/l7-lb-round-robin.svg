<svg width="100%" viewBox="0 0 720 369" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Round robin ignores queue length</title>
<desc id="d">Eight incoming requests reach NGINX, which feeds three servers A, B and C with queues of 5, 3 and 4 waiting travelers. Round robin sends traveler 1 to A, 2 to B and 3 to C in turn, regardless of how long or slow each queue is.</desc>
