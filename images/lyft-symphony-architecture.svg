<svg width="100%" viewBox="0 0 720 352" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Lyft Symphony architecture</title>
<desc id="d">Three components in sequence: the LTV forecaster predicts user lifetime value, the budget allocator fits cost curves to set budgets, and the bidders push bids to channels such as Facebook and Google. A feedback arrow returns from the bidders to the LTV forecaster.</desc>
