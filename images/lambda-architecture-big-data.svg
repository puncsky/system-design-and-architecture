<svg width="100%" viewBox="0 0 760 536" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Lambda architecture for big data systems</title>
<desc id="d">A new data stream (1) feeds both the batch layer (2) on Hadoop, where all data in HDFS is periodically recomputed by MapReduce into precomputed views, and the speed layer (4) on Storm, where a processed stream updates incremental views. The serving layer (3) holds the batch views as partial aggregates and the real-time views, and the two are merged into a merged view in HBase (5).</desc>
