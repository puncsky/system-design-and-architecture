<title id="t">按比例分配撮合示例</title>
<desc id="d">订单簿中有买入 2@100（#1）以及两张卖单：卖出 2@100（#3）和卖出 2@100（#2）。按比例分配撮合把这张买单拆给两张卖单，产生两笔 1@100 的成交（#1 对 #3、#1 对 #2），#3 和 #2 各剩下卖出 1@100。</desc>
