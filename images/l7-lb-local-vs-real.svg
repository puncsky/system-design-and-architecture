<svg width="100%" viewBox="0 0 760 384" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">One load balancer versus many in the real world</title>
<desc id="d">Left: requests reach a single LB that fans out to a pool of servers, which is how LB methods are typically analyzed. Right: requests reach several LBs and every LB is connected to every server, which is how LBs are configured in the real world.</desc>
