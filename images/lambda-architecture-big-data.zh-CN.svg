<title id="t">大数据系统的 Lambda 架构</title>
<desc id="d">新数据流（1）同时进入 Hadoop 上的批处理层（2）和 Storm 上的快速层（4）：批处理层用 MapReduce 对 HDFS 中的全部数据定期重算，得到预计算视图；快速层处理数据流并更新增量视图。服务层（3）保存由部分聚合组成的批处理视图以及实时视图，二者合并为 HBase 中的合并视图（5）。</desc>
