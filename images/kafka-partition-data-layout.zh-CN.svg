<svg width="100%" viewBox="0 0 390 520" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Kafka 分区的数据布局</title>
<desc id="d">分区维护一份活跃分段列表，每个分段占一行，记录它的偏移量范围。删除作用于最旧的一行，追加作用于最新的一行，读取则看到中间各行的一致视图。第一行和最后一行分别指向分段文件 topic/34477849968.kafka 和 topic/82796232652.kafka，每个文件都是一串消息。</desc>
