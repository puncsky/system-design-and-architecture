<title id="t">推送通知登录确认</title>
<desc id="d">Web 应用通过服务器创建会话并订阅（1），服务器在消息队列上订阅（1）。服务器通过 Apple Push Notification 或 Google Cloud Messaging 向移动应用发起询问（2）；移动应用把应答发回服务器（3），服务器再把结果发布到消息队列（4）。</desc>
