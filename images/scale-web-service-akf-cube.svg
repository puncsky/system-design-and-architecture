<title id="t">AKF scale cube</title>
<desc id="d">A cube with three axes. X-axis scalability is replicate and load balance: replicate web servers, keep session state out of the app tier, use read replicas for the DB tier. Y-axis scalability splits by service, Service A to F, each with its own database. Z-axis scalability segments by customer into NA and EU pods, POD 1 to POD 4.</desc>
