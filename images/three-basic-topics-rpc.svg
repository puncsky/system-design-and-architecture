<svg width="100%" viewBox="0 0 720 320" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">How RPC works: request and reply between client and server processes</title>
<desc id="d">A client process holds a client program, a client stub procedure and a communication module. A server process holds a communication module, a dispatcher, a server stub procedure and a service procedure. The client's communication module sends a Request to the server's communication module and receives a Reply back.</desc>
