<title id="t">简化的事件驱动架构</title>
<desc id="d">中介、事件队列和通道合并为一。事件经通道交给一个处理器；该处理器再送入第二个通道，第二个通道分发给三个处理器，其中一个处理器又送入第三个通道和最后一个处理器。</desc>
