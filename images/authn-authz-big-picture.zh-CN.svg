<svg width="100%" viewBox="0 0 760 946" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">身份验证、授权与身份管理全貌</title>
<desc id="d">客户端先到达边缘的身份感知代理，代理用 Bloom filter 和 Redis 黑名单检查令牌是否被吊销。没有有效凭证的请求被重定向到 IAM 团队的身份提供者；有效令牌则进入服务网格，再经过授权层（RBAC、PBAC/ABAC、ReBAC）访问受保护资源。</desc>
