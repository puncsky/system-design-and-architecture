<svg width="100%" viewBox="0 0 760 576" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">股票交易所架构</title>
<desc id="d">移动端、服务器集群和浏览器客户端经反向代理到达 API 网关，网关调用认证并把请求路由到六个服务：股票元数据、订单匹配、订单、余额与记账、支付和用户存储。订单与订单匹配双向通信，订单把数据交给余额与记账，各服务都有自己的存储。股票元数据调用外部定价，订单向清算所结算，支付连接银行、ACH 和 Visa，它们都在虚线边界之外。</desc>
