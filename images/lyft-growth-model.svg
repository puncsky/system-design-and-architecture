<svg width="100%" viewBox="0 0 760 312" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Lyft growth model</title>
<desc id="d">Six acquisition channels (organic, search, social, partners, retarget, referrals) feed two funnels. Drivers go from landing page to lead, background and vehicle check, activation and driver hours; riders go from app install to activation to rides. Both funnels pass through the Acquire, Nurture and Grow stages.</desc>
