<svg width="100%" viewBox="0 0 760 578" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">欺诈检测架构</title>
<desc id="d">训练：Spark 上的流式 ETL 用 MLlib 的 K-means 处理 Kafka 主题，批处理 ETL 用 scikit-learn 的 DBSCAN 处理离线历史数据，产出聚类特征。服务：调用方向规则引擎获取风险分数，规则引擎调用欺诈检测评分服务；评分服务读取聚类特征和流计数器，并调用其他服务。规则保存在规则数据库中，可通过管理门户调整。</desc>
