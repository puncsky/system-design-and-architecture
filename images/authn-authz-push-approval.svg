<title id="t">Push notification login approval</title>
<desc id="d">The web app creates a session and subscribes through the server (1), and the server subscribes to a message queue (1). The server asks Apple Push Notification or Google Cloud Messaging to ask the mobile app (2); the mobile app answers the server (3), which publishes the result to the message queue (4).</desc>
