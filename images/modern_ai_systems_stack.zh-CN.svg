<title id="t">现代 AI 系统技术栈</title>
<desc id="d">顶部的目标是在延迟、成本、资源、可靠性和安全的约束下最大化任务成功率。其下自上而下依次是：应用和用户；智能体 harness（规划、上下文、记忆、工具、子智能体）；模型与外部环境；服务系统与工具；运行时、内核与系统；硬件。侧栏表示智能体、服务与硬件需要协同设计。</desc>
