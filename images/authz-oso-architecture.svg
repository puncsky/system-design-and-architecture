<svg width="100%" viewBox="0 0 720 536" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Oso Cloud architecture</title>
<desc id="d">A single Oso Cloud Primary in a central region (for example us-east-1) streams events to three Oso Cloud Replicas, one per availability zone, in the Oso VPC of your own region (for example eu-west-1). Your App 1 and Your App 2 run in your VPC; App 1 calls the replicas in availability zones 1 and 2, and App 2 calls the replicas in zones 2 and 3.</desc>
