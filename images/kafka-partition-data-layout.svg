<svg width="100%" viewBox="0 0 390 520" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Kafka partition data layout</title>
<desc id="d">A partition keeps an Active Segment List with one row per segment, each row giving an offset range. Deletes act on the oldest row, appends on the newest row, and reads see a consistent view of the rows in between. The first and last rows point to segment files topic/34477849968.kafka and topic/82796232652.kafka, each a sequence of messages.</desc>
