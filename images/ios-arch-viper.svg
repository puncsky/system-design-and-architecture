<svg width="100%" viewBox="0 0 760 418" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">VIPER</title>
<desc id="d">Five roles: View, Presenter, Interactor, Entity and Router. The View owns the Presenter and sends it user actions, and the Presenter updates the View (dashed). The Presenter owns the Interactor and asks it for updates; the Interactor notifies the Presenter (dashed) and knows about the Entity (dashed). The Router is connected to the Presenter (dashed).</desc>
