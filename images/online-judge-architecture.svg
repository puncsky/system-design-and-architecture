<svg width="100%" viewBox="0 0 720 420" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Online judge architecture</title>
<desc id="d">A presentation layer calls an API. The API records each submission in a submission database and publishes it to a submission queue. A code execution engine, backed by a sandbox and a compiler or interpreter, polls the queue and works with the database.</desc>
