<svg width="100%" viewBox="0 0 720 436" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Facebook TAO 读取故障转移</title>
<desc id="d">布局与 TAO 架构图相同。在副本数据中心，Web 服务器无法访问自己的跟随缓存时，故障转移到另一个集群的跟随缓存；跟随缓存无法访问领导缓存时直接读取副本数据库；领导缓存无法访问数据库时，改为读取主数据中心的领导缓存。</desc>
