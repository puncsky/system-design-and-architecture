<title id="t">Cleo typeahead architecture</title>
<desc id="d">A user types in the browser, which keeps a browser cache and calls the web tier. The web tier calls the Aggregator inside Typeahead Search, which fans out to typeahead backends for social network, company, group, skill, site feature and more.</desc>
