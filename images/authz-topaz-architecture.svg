<svg width="100%" viewBox="0 0 760 544" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Topaz architecture</title>
<desc id="d">The application calls the Topaz SDK, which sends authorization requests to the Authorizer. The Authorizer combines ReBAC built-ins, data from the BoltDB-backed Directory and data.json, is driven by policy configuration, and writes decision logs. The Topaz CLI manages the policy configuration and the Directory through the directory management API.</desc>
