<svg width="100%" viewBox="0 0 760 578" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Kafka 集群概览</title>
<desc id="d">生产者把主题 zerg.hydra 写入 Kafka 集群中的三个代理，消费者从同一组代理读取。每个代理保存三个分区中两个分区的副本，其中一个标为领导者；集群内的 ZooKeeper 为代理、生产者和消费者管理并共享状态。</desc>
