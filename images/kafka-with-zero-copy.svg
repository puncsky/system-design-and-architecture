<svg width="100%" viewBox="0 0 288 452" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Kafka data path with zero-copy</title>
<desc id="d">With zero-copy the application only calls transferTo() and the data never enters an application buffer. A DMA copy moves data from the disk into the kernel read buffer, step 2 passes it from the read buffer to the socket buffer inside the kernel, and a DMA copy moves it into the NIC buffer.</desc>
