<svg width="100%" viewBox="0 0 760 430" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">常驻智能体架构</title>
<desc id="d">各类应用与渠道（桌面应用、移动端与网页、Slack、邮件与定时任务、电话与会议）把输入发送到运行智能体的服务器。服务器上，入口检查并路由输入，放入每个对话一个的队列，再交给智能体循环和工具；循环调用模型，在数据库中加载和保存状态，并把工具调用发送到智能体的电脑，由命令执行器驱动带 Chrome 的桌面，连接器服务提供文件与连接器。持久状态把实时更新推送回各渠道。</desc>
