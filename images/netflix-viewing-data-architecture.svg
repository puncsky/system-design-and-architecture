<svg width="100%" viewBox="0 0 760 410" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Netflix viewing data architecture</title>
<desc id="d">Clients write a stream of viewing events and read through a Viewing Service. A stateful tier of in-memory nodes 0 to n-1 holds Active Sessions, Latest Positions and View Summary. Active Sessions are stored to and read from the Sessions data store, View Summary flows into the Viewing History data store, which is fronted by Memcached. A stateless tier acts as the fallback and reaches both stores.</desc>
