<svg width="100%" viewBox="0 0 760 430" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Always-on agent architecture</title>
<desc id="d">Apps and channels (desktop, mobile and web, Slack, email and schedules, phone calls and meetings) send input to a server that runs the agent. On the server an entry point checks and routes input into a per-conversation queue that feeds the agent loop and its tools; the loop talks to the model, loads and saves state in a database, and sends tool calls to the agent's computer, where a command runner drives a desktop with Chrome and a connector server exposes files and connectors. Saved state pushes live updates back to the channels.</desc>
