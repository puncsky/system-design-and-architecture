<svg width="100%" viewBox="0 0 720 468" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Photo upload flow</title>
<desc id="d">The browser sends the upload to the web server (1), which asks the Haystack Directory (2) and gets its answer (3). The web server then writes the photo to each Haystack Store replica (4) and replies to the browser (5). The Haystack Cache and CDN are not on this path.</desc>
