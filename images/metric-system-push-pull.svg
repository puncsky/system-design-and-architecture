<svg width="100%" viewBox="0 0 720 596" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Metric system: InfluxDB push model and Prometheus pull model</title>
<desc id="d">Top: a server farm whose telegraf agents write to InfluxDB, which Grafana queries through a REST API. Bottom: Prometheus retrieval pulls from an application's client library and from an exporter in front of a third-party application, stores the data, answers PromQL queries for the web UI, Grafana and API clients, uses service discovery, and sends alerts through Alertmanager to PagerDuty and email.</desc>
