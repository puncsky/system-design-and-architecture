<svg width="100%" viewBox="0 0 760 534" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Smart stock price notification architecture</title>
<desc id="d">A cronjob triggers the price ticker, which ticks external vendors every 5 minutes and batch-writes into a time-series database, and the price watcher, which periodically reads it, uses a throttler cache and emits events to a notification queue. The notifier reads the queue, looks up User Settings (reached by the Robinhood app through a reverse proxy and API gateway) and sends through APNs, FCM or email services back to the app.</desc>
