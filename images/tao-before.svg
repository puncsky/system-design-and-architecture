<svg width="100%" viewBox="0 0 760 560" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Graph in Memcache before TAO</title>
<desc id="d">A PHP web server exposes an object and association API to the Facebook page. The API reads and writes both memcache, which caches nodes, edges and edge lists, and MySQL, which stores the social graph of users, posts, photos, comments and locations connected by associations such as AUTHOR, LIKE and FRIEND.</desc>
