<text x="320" y="332.4" font-size="13" font-weight="500" fill="#0C447C">是否被更新</text>
<path d="M548 248 L326 248 Q320 248 320 254 L320 300" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m898781)"/>
<rect x="369.5" y="238.6" width="129" height="18.9" rx="4" fill="#FFFFFF"/>
