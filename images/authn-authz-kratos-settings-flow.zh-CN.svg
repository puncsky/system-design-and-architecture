<rect x="190" y="150" width="260" height="36" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="320" y="168" font-size="13" font-weight="500" fill="#3C3489">执行设置前置钩子</text>
<path d="M320 114 L320 150" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m898781)"/>
<rect x="548" y="224" width="180" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="638" y="239.5" font-size="13" font-weight="500" fill="#2C2C2A">用户界面渲染</text>
<text x="638" y="256.4" font-size="13" font-weight="500" fill="#2C2C2A">设置流程表单</text>
