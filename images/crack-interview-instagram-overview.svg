<svg width="100%" viewBox="0 0 760 568" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Instagram architecture overview</title>
<desc id="d">Mobile and browser clients reach a Load Balancer, then a Reverse Proxy that routes to the Web App, API App and Task Processing. The Web App depends on image Blob store plus CDN; the API App depends on Follower, Feed, Search and Spam services backed by Redis, Hbase, ElasticSearch and Hbase. An observability box stands apart. Arrows indicate dependencies.</desc>
