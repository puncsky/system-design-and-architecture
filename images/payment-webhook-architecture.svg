<svg width="100%" viewBox="0 0 720 428" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Payment webhook architecture</title>
<desc id="d">Merchants use a dashboard frontend to register webhooks with the user and webhook registration services. The payment state machine publishes events to an event queue; webhook callers subscribe to it, read registrations, store notifications, retry through a cronjob, and make HTTP calls to merchants over the Internet. An observability stack sits alongside.</desc>
