<title id="t">How to use Auth0 FGA</title>
<desc id="d">Enterprise developers, step 1, use the FGA dashboard to configure Auth0 FGA; step 2, they work on their microservices, which call an FGA wrapper service that in turn calls Auth0 FGA.</desc>
