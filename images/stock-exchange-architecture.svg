<svg width="100%" viewBox="0 0 760 576" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Stock exchange architecture</title>
<desc id="d">Mobile, server-farm and browser clients go through a reverse proxy to an API gateway, which authenticates against auth and routes to six services: Stock Meta, Order Matching, Orders, Balances &amp; Bookkeeping, Payment and User Store. Orders and Order Matching talk both ways, Orders feeds Balances &amp; Bookkeeping, and each service has its own store. Stock Meta calls external pricing, Orders settles with a clearing house and Payment reaches banks, ACH and Visa, all outside a dashed boundary.</desc>
