<title id="t">传统（紧耦合）MVC</title>
<desc id="d">视图向控制器发送用户操作（虚线）。控制器更新模型并替换视图。模型通知视图（虚线），视图再从模型获取变更后的状态，因此视图同时与控制器和模型耦合。</desc>
