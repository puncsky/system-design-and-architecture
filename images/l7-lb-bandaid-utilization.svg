<svg width="100%" viewBox="0 0 720 336" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Servers report utilization to Bandaid in response headers</title>
<desc id="d">Backend servers return an X-Bandaid-Utilization header with each response: 0.35, 0.40 and 0.30 reach the first Bandaid, and the last server also sends 0.30 to a second Bandaid. Each Bandaid then forwards the responses onward.</desc>
